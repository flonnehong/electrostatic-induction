<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정전기 유도 — 접속하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap gate">
  <div class="unit">중학교 2학년 과학 · Ⅶ. 전기와 자기</div>
  <h1>정전기 유도</h1>
  <form class="card" id="form">
    <b>수업에 접속하기</b>
    <label class="field">반 <select id="cls" required><option value="">선택</option></select></label>
    <label class="field">번호 <input type="number" id="num" min="1" max="30" inputmode="numeric" required></label>
    <button class="primary wide" type="submit">접속 신청</button>
    <p class="hint">신청하면 선생님이 수락한 뒤 수업이 시작돼요. 반·번호와 활동 답이 선생님의 구글 시트에 저장되고, 이름은 적지 않아요.</p>
    <div class="msg" id="formMsg" role="alert"></div>
  </form>
  <div class="card" id="wait" hidden>
    <p class="who2" id="whoText"></p>
    <div class="spin" id="spin" aria-hidden="true"></div>
    <p class="big2" id="state" role="status"></p>
    <p class="hint" id="detail"></p>
    <div class="controls"><button class="primary" id="again" hidden>다시 신청</button><button id="change">반·번호 바꾸기</button></div>
  </div>
</main>
<button class="theme-btn" id="themeBtn" aria-label="화면 테마 바꾸기">🌓</button>
<script src="api.js"></script>
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id), { post, me, setMe, forget, newKey, today } = ESI;
ESI.theme($("themeBtn"));
for (let i=1;i<=7;i++){ const o = document.createElement("option"); o.value = i; o.textContent = i+"반"; $("cls").appendChild(o); }
let m = me(), timer = null, run = 0;
const show = (title, detail, spin=true) => { $("state").textContent = title; $("detail").textContent = detail || ""; $("spin").hidden = !spin; };
function screen(){ $("form").hidden = !!m; $("wait").hidden = !m; if (m) $("whoText").textContent = `2학년 ${m.cls}반 ${m.num}번`; }
$("form").onsubmit = e => {
  e.preventDefault();
  const c = +$("cls").value, n = +$("num").value;
  if (!c || !Number.isInteger(n) || n < 1 || n > 30){ $("formMsg").textContent = "반을 고르고 번호(1~30)를 적어 주세요."; $("formMsg").className = "msg bad"; return; }
  // 수락된 적 없는 기기는 같은 구분값을 다시 써서, 잘못 적은 번호의 신청이 남지 않게 한다
  const old = ESI.ls.get("pending"); forget();
  m = { cls:c, num:n, day:today(), key: old && /^[a-f0-9]{24}$/.test(old) ? old : newKey() };
  ESI.ls.set("pending", m.key); setMe(m); begin("join");
};
$("change").onclick = () => { run++; clearTimeout(timer); forget(); m = null; $("formMsg").textContent = ""; screen(); };
$("again").onclick = () => { $("again").hidden = true; begin("join", true); };
function begin(a, again){ run++; clearTimeout(timer); $("again").hidden = true; screen(); show("신청하는 중…"); step(a, again, run); }
async function step(a, again, my){
  let next = "poll", wait = 4000 + Math.random()*2000;
  try{
    const r = await post({ a, cls:m.cls, num:m.num, key:m.key, again: again === true });
    if (my !== run) return;
    if (!r.ok){
      next = a; wait = 5000 + Math.random()*4000;
      if (r.error === "full"){ show("신청이 너무 많아요", "선생님께 말씀드려 주세요.", false); return; }
      show("잠시 기다려 주세요", "서버가 바빠요. 자동으로 다시 신청해요.");
    }
    else if (r.status === "ok" || r.status === "end"){ ESI.ls.del("pending"); show("수락되었어요!", "수업 화면으로 이동해요."); location.replace("lesson.html"); return; }
    else if (r.status === "wait") show("선생님의 수락을 기다리고 있어요", "이 화면을 그대로 두면 자동으로 넘어가요.");
    else if (r.status === "no"){ show("선생님이 수락하지 않았어요", r.stop ? "선생님께 말씀드려 주세요." : "반과 번호가 맞는지 확인해 주세요.", false); $("again").hidden = !!r.stop; wait = 8000; }
    else if (r.status === "closed"){ show("아직 수업이 열리지 않았어요", "선생님이 수업을 열면 자동으로 신청돼요."); next = "join"; wait = 6000 + Math.random()*3000; }
    else next = "join"; // none: 명단이 새로 시작됨
  }catch(e){
    if (my !== run) return;
    show("서버에 연결하지 못했어요", "자동으로 다시 시도해요. 계속되면 선생님께 말씀드려 주세요."); next = a; wait = 8000;
  }
  timer = setTimeout(() => step(next, false, my), wait);
}
screen(); if (m) begin("poll");
})();
</script>
</body>
</html>
